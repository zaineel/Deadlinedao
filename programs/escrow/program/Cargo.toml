# EXPERIMENTAL / UNAUDITED / DEVNET-ONLY. NOT BUILT in the authoring environment
# (rustc 1.68, no Anchor/Solana toolchain). Expect compile fixes on first build.
[package]
name = "deadlinedao-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deadlinedao_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
escrow-core = { path = "../core" }
